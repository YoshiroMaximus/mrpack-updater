<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mrpack updater</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Update Modrinth .mrpack files for a target Minecraft version, with special Fabric Carpet handling and GitHub fallback for compatible mod versions." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      // Key derivation mirrors STORAGE_PREFIX in src/lib/storage.ts.
      (function () {
        try {
          var p = location.pathname.replace(/\/[^\/]*$/, "") || "/";
          var k = "mrpack" + p.replace(/[^a-zA-Z0-9]/g, "_") + "_theme";
          var t = localStorage.getItem(k) || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
